spring.application.name=OrbiFlow
server.port=2000

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://mysql-service:3306/taskmanagmentsystem
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT configuration
jwt.secret=replace_this_with_a_strong_random_secret
# token validity in milliseconds (e.g., 3600000 = 1 hour)
jwt.expiration=3600000
